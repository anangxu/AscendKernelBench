# Default evaluation configuration for AscendKernelBench.
hardware: ascend910b2

########################### CORRECTNESS ###########################
# Five seeded trials, all must pass (docs/guide/evaluation.md).
num_correct_trials: 5
seed: 42
tolerances:
  fp32: {atol: 1.0e-4, rtol: 1.0e-4}
  fp16: {atol: 1.0e-2, rtol: 1.0e-2}
  bf16: {atol: 1.0e-2, rtol: 1.0e-2}
precision: fp32
########################### CORRECTNESS ###########################

########################## PERFORMANCE ############################
# Ten warmups follow SOL-ExecBench isolation practice; the 100 retained
# trials keep KernelBench-style timing statistics.
num_perf_trials: 100
num_warmup: 10
# Above this speedup a sample is flagged for review: kept in fast_0, but
# excluded from positive fast_p thresholds and the geometric mean.
excessive_speedup: 10.0
########################## PERFORMANCE ############################

############################ TIMEOUTS #############################
# Seconds. Build runs configure and build, each allowed build_timeout; the
# host worker budget is eval_timeout + 2 * build_timeout.
build_timeout: 600
eval_timeout: 300
############################ TIMEOUTS #############################

########################## GENERATION #############################
# Thinking depth (low | medium | high); empty omits the parameter. Reasoning
# tokens count against max_tokens, which is why the budget is this large.
# backend selects the authoring language (ascendc | pyasc). It is recorded in
# the run's generation_config.yaml; evaluation reads it from there.
generation:
  model: deepseek-flash
  temperature: 0.0
  max_tokens: 131072
  num_samples: 1
  prompt_mode: one_shot
  reasoning_effort: high
  backend: ascendc
########################## GENERATION #############################
